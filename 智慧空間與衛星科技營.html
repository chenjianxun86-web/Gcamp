<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧空間與衛星科技營 官方連結</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* 深空背景圖片與漸層疊加 */
            background-color: #0b0f19;
            background-image: 
                radial-gradient(circle at top right, rgba(76, 29, 149, 0.4), transparent 50%),
                radial-gradient(circle at bottom left, rgba(30, 58, 138, 0.6), transparent 50%),
                url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2048&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-blend-mode: screen;
        }
        /* 自訂按鈕懸停時的宇宙發光效果 */
        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        /* 主容器毛玻璃 */
        .glass-container {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 text-white">

    <!-- 主容器：深色毛玻璃效果 -->
    <div class="glass-container w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl flex flex-col items-center">
        
        <!-- 大頭貼 (營隊 Logo) -->
        <div class="relative w-28 h-28 mb-6">
            <!-- 這裡已經確保檔名為大寫的 image_3.PNG -->
            <img src="image_3.PNG" 
                 alt="營隊 Logo" 
                 class="w-full h-full object-cover rounded-full border-2 border-indigo-400/80 shadow-[0_0_15px_rgba(129,140,248,0.5)] transform transition duration-500 hover:scale-105 hover:rotate-3">
        </div>

        <!-- 標題與簡介 -->
        <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-200 via-indigo-300 to-purple-200 mb-2 tracking-wider text-center drop-shadow-md">
            智慧空間與衛星科技營
        </h1>
        <p class="text-indigo-200/90 text-sm mb-8 font-medium tracking-widest uppercase">
            NCKU GCAMP 2027 🛰️
        </p>

        <!-- 連結按鈕區塊 -->
        <div class="w-full flex flex-col gap-5">
            
            <!-- 報名表單連結 -->
            <a href="https://forms.gle/YTRSMGfrKdas5nUCA" target="_blank" rel="noopener noreferrer" class="glass-btn group relative w-full flex items-center justify-center py-4 px-6 rounded-2xl font-bold text-lg transition-all duration-300 transform hover:-translate-y-1">
                <span class="absolute left-6 text-2xl group-hover:scale-110 group-hover:rotate-12 transition-transform duration-300">📝</span>
                <span class="tracking-wide text-gray-50">報名表單</span>
            </a>

            <!-- IG 粉專連結 -->
            <a href="https://www.instagram.com/ncku_gcamp" target="_blank" rel="noopener noreferrer" class="glass-btn group relative w-full flex items-center justify-center py-4 px-6 rounded-2xl font-bold text-lg transition-all duration-300 transform hover:-translate-y-1">
                <span class="absolute left-6 text-2xl group-hover:scale-110 group-hover:rotate-12 transition-transform duration-300">📸</span>
                <span class="tracking-wide text-pink-100">IG 粉專</span>
            </a>

            <!-- 臉書粉專連結 -->
            <a href="https://www.facebook.com/nckugcamp" target="_blank" rel="noopener noreferrer" class="glass-btn group relative w-full flex items-center justify-center py-4 px-6 rounded-2xl font-bold text-lg transition-all duration-300 transform hover:-translate-y-1">
                <span class="absolute left-6 text-2xl group-hover:scale-110 group-hover:-rotate-12 transition-transform duration-300">📘</span>
                <span class="tracking-wide text-blue-100">臉書粉專</span>
            </a>

        </div>

        <!-- 底部裝飾 -->
        <div class="mt-12 text-indigo-300/50 text-xs font-bold tracking-[0.2em]">
            EXPLORE THE UNIVERSE
        </div>
    </div>

</body>
</html>
